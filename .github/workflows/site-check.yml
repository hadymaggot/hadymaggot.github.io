name: site check

on:
  push:
    paths-ignore:
      - "tools/**"
  pull_request:
    paths-ignore:
      - "tools/**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check site
        run: python scripts/check_site.py
